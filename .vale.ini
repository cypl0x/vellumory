# Prose checks of the documentation: Vale's own rules (spelling, repeated
# words), with the project's vocabulary of names and terms.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Vellumory

[*.org]
BasedOnStyles = Vale
# The manual's key descriptions (ox-texinfo's "- Key: KEYS ::") list keys.
TokenIgnores = (Key: [^:]+ ::)
